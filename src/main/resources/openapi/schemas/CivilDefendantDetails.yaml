type: object
description: Defendant Details of the case
x-class-extra-annotation: "@lombok.AllArgsConstructor"
properties:
  prosecutorDefendantId:
    type: string
    description: DefendantId provided by prosecutor.
    pattern: ^[a-zA-Z0-9-]*$
    maxLength: 36
  asn:
    type: string
    description: Arrest / Summons number
    maxLength: 20
  pncIdentifier:
    $ref: ./CivilPncId.yaml
  croNumber:
    $ref: ./CivilCroNumber.yaml
  documentationLanguage:
    $ref: ./CivilLanguage.yaml
  hearingLanguage:
    $ref: ./CivilLanguage.yaml
  address:
    $ref: ./CivilAddress.yaml
  numPreviousConvictions:
    type: integer
    description: Number of previous conviction cited by prosecutor.
  prosecutorCosts:
    $ref: ./CivilMoney.yaml
required:
- prosecutorDefendantId
- documentationLanguage
- hearingLanguage
- address
additionalProperties: false
