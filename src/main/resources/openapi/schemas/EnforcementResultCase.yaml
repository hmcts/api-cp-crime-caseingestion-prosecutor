type: object
description: A prosecution case within the hearing, together with its case-level and offence-level results.
properties:
  id:
    $ref: './Uuid.yaml'
  urn:
    description: The unique reference number for the case
    type: string
  caseLevelResults:
    type: array
    items:
      $ref: './EnforcementResultEntry.yaml'
  offences:
    type: array
    items:
      $ref: './EnforcementResultOffence.yaml'
required:
  - id
  - urn
  - caseLevelResults
  - offences
additionalProperties: false
