type: object
description: >-
  Case-resulted payload shared between Common Platform and the enforcement system (Libra) for a single hearing / defendant.
  Describes defendant-level, case-level and offence-level results produced at the conclusion of a hearing, which Common
  Platform then forwards to subscribed enforcement parties. Modelled on the CP `results.results-details` internal schema.
properties:
  hearingId:
    description: The identifier of the hearing at which these results were returned
    $ref: './Uuid.yaml'
  personId:
    description: The identifier of the defendant person these results apply to
    $ref: './Uuid.yaml'
  defendantLevelResults:
    description: Results imposed against the defendant as a whole (e.g. costs, surcharge, collection order).
    type: array
    items:
      $ref: './EnforcementResultEntry.yaml'
  cases:
    description: The cases heard at this hearing for this defendant, with their case- and offence-level results.
    type: array
    items:
      $ref: './EnforcementResultCase.yaml'
required:
  - hearingId
  - personId
  - defendantLevelResults
  - cases
additionalProperties: false
