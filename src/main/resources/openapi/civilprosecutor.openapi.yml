openapi: 3.0.3
info:
  title: Case Management Command API
  version: '1.0'
  description: REST API for submitting and resubmitting civil prosecutions (other
    and summons) to the staging prosecutors service.
servers:
- url: https://virtserver.swaggerhub.com/HMCTS-DTS/api-cp-civil-caseingestion-prosecutor/0.0.0
  description: Local development server
tags:
- name: Prosecutions
  description: Operations for submitting civil prosecutions
paths:
  /prosecutions:
    post:
      summary: Submit a civil prosecution
      description: Submit a new civil prosecution (other or summons). Returns a submission
        ID and status URL.
      operationId: submitProsecution
      tags:
      - Prosecutions
      requestBody:
        required: true
        content:
          application/vnd.stagingcivil.other-cases+json:
            schema:
              $ref: './schema/OtherCases.yaml'
            example:
              prosecutionCases:
                defendants:
                - prosecutorDefendantId: '123'
                  asn: ASN232
                  prosecutorCosts: '20.10'
                  defendantPerson:
                    title: Mr
                    forename: John
                    forename2: Adam
                    forename3: Theodore
                    surname: SMITH
                    contactDetails:
                      workTelephoneNumber: 02012345678
                      homeTelephoneNumber: 02087654321
                      mobileTelephoneNumber: 0789123456
                      primaryEmail: aer@af.com
                      secondaryEmail: aer@af.com
                    dateOfBirth: '1970-02-03'
                    selfDefinedInformation:
                      gender: 1
                      ethnicity: W1
                      nationality: W1
                      additionalNationality: W2
                    occupation: TA
                    occupationCode: 666
                    driverNumber: AS
                    address:
                      address1: Line 1
                      address2: Line 2
                      address3: Line 3
                      address4: Line 4
                      address5: Line 5
                      postcode: CR0 1XG
                    nationalInsuranceNumber: AA123456C
                  documentationLanguage: E
                  hearingLanguage: E
                  languageRequirement: no special language needs
                  specificRequirements: no special needs
                  numPreviousConvictions: 3
                  offences:
                  - cjsOffenceCode: CA03010
                    offenceSequenceNo: 1
                    offenceCommittedDate: '2018-06-20'
                    otherDate: '2018-06-21'
                    offenceDateCode: 1
                    offenceLocation: Croydon
                    offenceWording: Prosecution other wording
                    offenceWordingWelsh: Prosecution other wording in Welsh
                    statementOfFacts: Prosecution statements of facts
                    prosecutorCompensation: '15.30'
                    backDuty: '+340.30'
                    backDutyDateFrom: '2018-04-30'
                    backDutyDateTo: '2018-05-30'
                    vehicleMake: Ford
                    vehicleRegistrationMark: AB11 ABC
                informant: Adam
                caseMarker: Case marker 1
                urn: case_urn_value
              prosecutingAuthority: GAAAA01
              hearingDetails:
                courtHearingLocation: Liverpool Crown Court
                dateOfHearing: '2022-02-04'
                timeOfHearing: '09:05:00.001'
          application/vnd.stagingcivil.summons+json:
            schema:
              $ref: './schema/SummonsProsecution.yaml'
            example:
              prosecutionCases:
                defendants:
                - prosecutorDefendantId: '123'
                  asn: ASN232
                  prosecutorCosts: '20.10'
                  defendantPerson:
                    title: Mr
                    forename: John
                    forename2: Adam
                    forename3: Theodore
                    surname: SMITH
                    contactDetails:
                      workTelephoneNumber: 02012345678
                      homeTelephoneNumber: 02087654321
                      mobileTelephoneNumber: 0789123456
                      primaryEmail: aer@af.com
                      secondaryEmail: aer@af.com
                    dateOfBirth: '1970-02-03'
                    selfDefinedInformation:
                      gender: 1
                      ethnicity: W1
                      nationality: W1
                      additionalNationality: W2
                    occupation: TA
                    occupationCode: 666
                    driverNumber: AS
                    address:
                      address1: Line 1
                      address2: Line 2
                      address3: Line 3
                      address4: Line 4
                      address5: Line 5
                      postcode: CR0 1XG
                    nationalInsuranceNumber: AA123456C
                  documentationLanguage: E
                  hearingLanguage: E
                  languageRequirement: no special language needs
                  specificRequirements: no special needs
                  numPreviousConvictions: 3
                  offences:
                  - cjsOffenceCode: CA03010
                    offenceSequenceNo: 1
                    offenceCommittedDate: '2018-06-20'
                    otherDate: '2018-06-21'
                    offenceDateCode: 1
                    offenceLocation: Croydon
                    offenceWording: Prosecution other wording
                    offenceWordingWelsh: Prosecution other wording in Welsh
                    statementOfFacts: Prosecution statements of facts
                    prosecutorCompensation: '15.30'
                    backDuty: '+340.30'
                    backDutyDateFrom: '2018-04-30'
                    backDutyDateTo: '2018-05-30'
                    vehicleMake: Ford
                    vehicleRegistrationMark: AB11 ABC
                informant: Adam
                caseMarker: Case marker 1
                urn: case_urn_value
              prosecutingAuthority: GAAAA01
              hearingDetails:
                courtHearingLocation: Liverpool Crown Court
                dateOfHearing: '2022-02-04'
                timeOfHearing: '09:05:00.001'
      responses:
        '202':
          description: Prosecution accepted for processing
          content:
            application/json:
              schema:
                $ref: './schema/UrlResponse.yaml'
              example: &id001
                statusURL: https://www.dummy.gov.uk/foo/bar/8191c165-e9e4-4fd7-ac6d-5bfd04690f77
                submissionId: 8191c165-e9e4-4fd7-ac6d-5bfd04690f77
        '500':
          description: Internal Server Error
