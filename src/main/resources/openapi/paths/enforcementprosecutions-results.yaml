post:
  summary: Share case-resulted information with the enforcement system
  description: >-
    Submit the results recorded at a hearing so that Common Platform can forward them to the enforcement system (Libra)
    and any other subscribed third parties. Supports CCT-1222 "Case resulted" on the Enforcement 2025 E2E flow: a prosecutor
    (or Libra acting as prosecutor) POSTs the hearing's defendant-, case- and offence-level results; CP acknowledges
    synchronously and distributes the payload asynchronously to subscribers.
  tags:
    - Sharing Case Results With Enforcement
  requestBody:
    description: Case-resulted details for a single hearing and defendant.
    required: true
    content:
      application/vnd.hmcts.enforcementprosecutions.results.v1+json:
        schema:
          $ref: '../schemas/EnforcementResultDetails.yaml'
        example:
          hearingId: 6b7b9adc-ccee-4b13-b2c7-499c28e98962
          personId: 0f5a7b3a-2b2c-4b14-9b76-1d8c8ed0a2a1
          defendantLevelResults:
            - label: Costs
              court: Lavender Hill Magistrates' Court
              courtRoom: Court 1
              orderedDate: '2026-04-10'
              prompts:
                - id: a1e4c6b4-7f8d-4d9d-9a65-7b1b6a2f3c51
                  label: Amount of costs
                  value: '85'
            - label: Collection order
              court: Lavender Hill Magistrates' Court
              courtRoom: Court 1
              orderedDate: '2026-04-10'
              prompts:
                - id: c3e2f7ab-9d14-4c0f-b3fa-1a2b3c4d5e6f
                  label: Collection order type
                  value: Make payments as ordered
          cases:
            - id: 2f1e9a84-1b23-4c98-8a7b-9c0d1e2f3a4b
              urn: TVL72301372
              caseLevelResults:
                - label: Surcharge
                  court: Lavender Hill Magistrates' Court
                  courtRoom: Court 1
                  orderedDate: '2026-04-10'
                  prompts:
                    - id: 4a7b1c2d-3e4f-5061-7283-94a5b6c7d8e9
                      label: Amount of surcharge
                      value: '34'
              offences:
                - id: 9b0a1c2d-3e4f-5061-7283-94a5b6c7d8e9
                  startDate: '2025-11-01'
                  endDate: '2025-11-01'
                  offenceWording: Possess a television set with intent to install / use without a licence
                  plea:
                    pleaDate: '2026-02-20'
                    pleaValue: GUILTY
                  offenceLevelResults:
                    - label: Fine
                      court: Lavender Hill Magistrates' Court
                      courtRoom: Court 1
                      orderedDate: '2026-04-10'
                      prompts:
                        - id: 6d7e8f90-1a2b-3c4d-5e6f-708192a3b4c5
                          label: Amount of fine
                          value: '147'
                  convictionDate: '2026-04-10'
                  verdict:
                    verdictDate: '2026-04-10'
                    verdictCategory: CONVICTED
                    verdictDescription: Convicted after guilty plea
  responses:
    '202':
      description: Accepted. CP has accepted the case-resulted payload and will forward it asynchronously to enforcement and other subscribed parties.
      content:
        application/json:
          schema:
            type: object
            properties:
              statusURL:
                description: URL at which the caller may poll the submission status
                type: string
              submissionId:
                description: Unique identifier for this case-resulted submission
                type: string
                format: uuid
            required:
              - statusURL
              - submissionId
            additionalProperties: false
          example:
            statusURL: https://www.dummy.gov.uk/enforcementprosecutions/submissions/8191c165-e9e4-4fd7-ac6d-5bfd04690f77
            submissionId: 8191c165-e9e4-4fd7-ac6d-5bfd04690f77
    '400':
      description: Bad Request. The payload failed schema or business-rules validation.
    '401':
      description: Unauthorized. Missing or invalid bearer token / APIM subscription key.
    '403':
      description: Forbidden. The caller is not authorised to submit enforcement results.
