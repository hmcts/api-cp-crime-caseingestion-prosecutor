type: object
description: Individual details
properties:
  nameDetails:
    $ref: ./NameDetails.yaml
  contactDetails:
    $ref: ./ContactDetails.yaml
  nationality:
    type: string
    description: Country of origin as stated by the defendant, as per CJS Standards
      section 3.103
    maxLength: 3
  additionalNationality:
    type: string
    description: Additional country of origin as stated by the defendant, as per CJS
      Standards section 3.103
    maxLength: 3
  dateOfBirth:
    $ref: ./Date.yaml
  gender:
    $ref: ./Gender.yaml
  occupation:
    type: string
    description: The description of an occupation.
    maxLength: 54
  occupationCode:
    type: integer
    minimum: 0
    maximum: 99999
    description: An occupation code
  observedEthnicity:
    type: number
  ethnicity:
    type: string
    description: Ethnicity Self Defined Code
  driverNumber:
    type: string
    description: Driver number for DVLA case
    maxLength: 16
  languageRequirement:
    type: string
    description: Notes about the defendant's language needs, e.g. interpreter details
    maxLength: 150
  specificRequirements:
    type: string
    description: Notes about any help that the defendant may need when attending court
    maxLength: 150
  nationalInsuranceNumber:
    type: string
    description: National Insurance Number (CGS DSC 5.15)
    minLength: 9
    maxLength: 9
    pattern: ^(?!BG)(?!GB)(?!NK)(?!KN)(?!TN)(?!NT)(?!ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9][0-9][0-9][0-9][0-9][0-9][A-D
      ]$
  parentGuardian:
    $ref: ./ParentGuardian.yaml
  aliases:
    type: array
    minItems: 1
    items:
      $ref: ./NameDetails.yaml
  custodyStatus:
    $ref: ./CustodyStatus.yaml
  bailConditions:
    type: string
    maxLength: 2500
required:
- nameDetails
- gender
additionalProperties: false
